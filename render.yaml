# The persistent disk requires a paid Render web-service plan. SQLite data and
# uploaded media are stored on the same disk so they survive redeploys/restarts.
services:
  - type: web
    name: app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: starter
    disk:
      name: farm-watch-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_FILE
        value: /var/data/farm_watch.db
      - key: MEDIA_DIR
        value: /var/data/media
      - key: ADMIN_USERNAME
        value: chief
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECRET_KEY
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
